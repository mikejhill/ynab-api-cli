[project]
name = "ynab-api-cli"
version = "0.1.0"
description = "Complete contract-driven REST CLI for YNAB"
readme = "README.md"
authors = [
    { name = "Mike Hill" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema[format]>=4.26.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
ynab-api-cli = "ynab_api_cli.__main__:Application.main"

[project.urls]
Homepage = "https://github.com/mikejhill/ynab-api-cli"
Repository = "https://github.com/mikejhill/ynab-api-cli"
Issues = "https://github.com/mikejhill/ynab-api-cli/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "openapi-python-client==0.29.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins: no shadowing builtins
    "ANN",   # flake8-annotations: every signature annotated, no Any
    "ARG",   # unused arguments
    "B",     # flake8-bugbear
    "BLE",   # no blind except
    "C4",    # comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle: file, class, method docstrings
    "DTZ",   # timezone-aware datetimes
    "E",     # pycodestyle errors
    "ERA",   # no commented-out code
    "F",     # pyflakes
    "FA",    # from __future__ import annotations
    "FBT",   # no boolean positional arguments
    "G",     # logging format strings
    "I",     # isort
    "LOG",   # logging misuse
    "N",     # pep8-naming
    "PERF",  # performance anti-patterns
    "PGH",   # no blanket type: ignore / noqa
    "PIE",   # misc lints
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "RET",   # return statements
    "RSE",   # raise statements
    "RUF",   # ruff-specific
    "S",     # bandit security
    "SIM",   # simplifications
    "T20",   # no print()
    "TID",   # tidy imports
    "TRY",   # exception handling
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "TRY003",  # long messages in raise: context-rich messages are required here
]
# TC excluded: moving annotation-only imports into TYPE_CHECKING blocks hurts readability.

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR2004",  # literal expected values are clearer in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
source = ["ynab_api_cli"]
branch = true
omit = ["src/ynab_api_cli/generated/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.poe.tasks]
distribution-check = { cmd = "python -m ynab_api_cli.distribution" }
live = { cmd = "python -m ynab_api_cli.live" }
generate = { cmd = "python -m ynab_api_cli.development generate" }
codegen-check = { cmd = "python -m ynab_api_cli.development codegen-check" }
contract-check = { cmd = "python -m ynab_api_cli.verification contract-check" }
compat-check = { cmd = "python -m ynab_api_cli.verification compat-check" }
skill-check = { cmd = "python -m ynab_api_cli.verification skill-check" }
format = { cmd = "ruff format .", help = "Format code" }
format-check = { cmd = "ruff format --check .", help = "Check formatting" }
lint = { cmd = "ruff check .", help = "Lint code" }
lint-fix = { cmd = "ruff check . --fix", help = "Lint and auto-fix" }
typecheck = { cmd = "ty check", help = "Type check (strict)" }
test = { cmd = "pytest --cov", help = "Run tests with coverage" }
fix = { sequence = ["format", "lint-fix"], help = "Auto-fix formatting and lint" }
check = { sequence = ["format-check", "lint", "typecheck", "test"], help = "Run every quality gate" }

[tool.ynab_api_cli.codegen]
package_name_override = "generated"
post_hooks = []

[tool.uv.build-backend]
source-include = [
    "skills/**", "templates/**", "docs/**", ".github/**", "tests/**",
    "release-please-config.json", ".release-please-manifest.json", "CHANGELOG.md",
]

[tool.ynab_api_cli.codegen.class_overrides.TransactionFlagColorType1]
class_name = "Flag1"
module_name = "flag_1"
[tool.ynab_api_cli.codegen.class_overrides.TransactionFlagColorType2Type1]
class_name = "Flag2"
module_name = "flag_2"
[tool.ynab_api_cli.codegen.class_overrides.TransactionFlagColorType3Type1]
class_name = "Flag3"
module_name = "flag_3"
[tool.ynab_api_cli.codegen.class_overrides.TransactionSummaryBaseDebtTransactionTypeType1]
class_name = "Debt1"
module_name = "debt_1"
[tool.ynab_api_cli.codegen.class_overrides.TransactionSummaryBaseDebtTransactionTypeType2Type1]
class_name = "Debt2"
module_name = "debt_2"
[tool.ynab_api_cli.codegen.class_overrides.TransactionSummaryBaseDebtTransactionTypeType3Type1]
class_name = "Debt3"
module_name = "debt_3"
[tool.ynab_api_cli.codegen.class_overrides.CategoryBaseGoalTypeType1]
class_name = "Goal1"
module_name = "goal_1"
[tool.ynab_api_cli.codegen.class_overrides.CategoryBaseGoalTypeType2Type1]
class_name = "Goal2"
module_name = "goal_2"
[tool.ynab_api_cli.codegen.class_overrides.CategoryBaseGoalTypeType3Type1]
class_name = "Goal3"
module_name = "goal_3"
