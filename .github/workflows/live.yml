name: Seeded read-only YNAB CLI acceptance

# Environment secrets must be configured by the repository owner separately.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ynab-live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ynab-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install reviewed locked dependencies without YNAB secrets
        run: |
          uv build --wheel
          uv sync --locked --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Run required seeded assertions with step-scoped secrets
        env:
          YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
          YNAB_ACCESS_TOKENS: ${{ secrets.YNAB_ACCESS_TOKENS }}
          YNAB_TEST_PLAN_ID: ${{ secrets.YNAB_TEST_PLAN_ID }}
        run: |
          ulimit -c 0
          .venv/bin/python -m ynab_api_cli.ci_live
