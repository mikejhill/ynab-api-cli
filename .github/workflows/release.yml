name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish (for example v0.1.0)
        type: string
        required: true
      testpypi:
        description: Publish to TestPyPI instead of PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er '.headBranchName' <<< "$PR_JSON")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  target:
    needs: release-please
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: resolve
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a vMAJOR.MINOR.PATCH tag'; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: target
    if: always() && needs.target.result == 'success'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [target, ci]
    if: always() && needs.ci.result == 'success' && needs.target.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Version must match tag
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: >-
          uv run python -c 'import os, tomllib; from pathlib import Path;
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"];
          assert os.environ["TAG"] == "v" + version, "Release tag does not match package version"'
      - run: uv build
      - run: uvx --from twine==6.2.0 twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv run poe distribution-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: dist/*-release.zip
          if-no-files-found: error

  publish-pypi:
    needs: [target, build]
    if: always() && needs.build.result == 'success' && !inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ynab-api-cli/
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: release-assets/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-testpypi:
    needs: build
    if: always() && needs.build.result == 'success' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ynab-api-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
